name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13', '3.15']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Run unit tests with temporary databases
        run: python -m unittest discover -s tests -v

  lint:
    name: Python lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - run: python -m pip install ruff==0.17.6
      - run: ruff check .
      - run: ruff format --check .

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Check JavaScript syntax
        run: |
          for file in static/*.js; do node --check "$file"; done
      - name: Run frontend tests
        run: node --experimental-vm-modules --test tests/*.test.cjs

  docker:
    name: Docker build and smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build production image
        run: docker build --tag filamentdb-ci:test .
      - name: Start isolated container
        run: >-
          docker run --detach --name filamentdb-ci --network none --read-only
          --tmpfs /tmp --tmpfs /data:uid=10001,gid=10001 filamentdb-ci:test
      - name: Check runtime dependencies and API startup
        shell: bash
        run: |
          docker exec filamentdb-ci python -c 'import sys, sqlite3, pymysql, cryptography; print(sys.version); print("SQLite", sqlite3.sqlite_version)'
          for attempt in {1..30}; do
            if docker exec filamentdb-ci python -c 'import json, urllib.request; opener = urllib.request.build_opener(urllib.request.ProxyHandler({})); version = json.load(opener.open("http://127.0.0.1:49173/api/version", timeout=2)); inventory = json.load(opener.open("http://127.0.0.1:49173/api/filaments", timeout=2)); assert version["database"] == "sqlite"; assert inventory == []; print(version)' 2>/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs filamentdb-ci
          exit 1
      - name: Show container logs and remove test container
        if: always()
        run: |
          docker logs filamentdb-ci || true
          docker rm --force filamentdb-ci || true
