# Keep the production project and its data volume stable when the checkout is renamed.
name: 3d-filament-db

services:
  app:
    container_name: filamentdb
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-}
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
    restart: unless-stopped
    labels:
      docker-update.managed: "false"
    volumes:
      - filament-data:/data
    ports:
      - "127.0.0.1:49173:49173"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:49173/api/filaments', timeout=3)"]
      start_period: 30s
      start_interval: 1s
      interval: 30s
      timeout: 5s
      retries: 3
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
volumes:
  filament-data:
